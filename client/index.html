<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="AI-powered study platform: turn long documents into structured notes, flashcards, quizzes, and grounded Q&A."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FileSense — Understand every document" />
    <meta
      property="og:description"
      content="AI-powered study platform: turn long documents into structured notes, flashcards, quizzes, and grounded Q&A."
    />
    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FileSense — Understand every document" />
    <meta
      name="twitter:description"
      content="AI-powered study platform: turn long documents into structured notes, flashcards, quizzes, and grounded Q&A."
    />
    <meta name="twitter:image" content="/logo.svg" />

    <!-- Google Fonts: Public Sans (UI/Body) & Geist Mono (Code/Stats) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-FOUC Dark Mode Pre-Render Script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('filesense_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <title>FileSense — Understand every document</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
